<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>認知手冊生成器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2E2B36; --mute:#6F6A7A; --line:#E6E1D8; --bg:#FFFFFF; --stage:#EEF3F6;
  --sun:#FFC93C; --sun-deep:#E3A300; --coral:#F0645A; --mint:#2FA886; --sky:#4C9BE8; --grape:#9067D0; --teal:#2C93AE;
  --panel:#FFFFFF; --chip:#F5F2EC;
  --title:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#F1EEF6; --mute:#B4AEC0; --line:#3A3744; --bg:#1C1B22; --stage:#26252E; --panel:#22212A; --chip:#2E2C36; }
}
:root[data-theme="dark"]{ --ink:#F1EEF6; --mute:#B4AEC0; --line:#3A3744; --bg:#1C1B22; --stage:#26252E; --panel:#22212A; --chip:#2E2C36; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}

.top{max-width:1360px;margin:0 auto;padding:28px 24px 8px;display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap}
.brand{flex:1 1 420px}
.brand h1{font-family:var(--title);font-weight:700;font-size:clamp(34px,5vw,52px);line-height:1.1;margin:0 0 10px;letter-spacing:.02em}
.brand p{margin:0;color:var(--mute);max-width:36em}
.dots{display:flex;gap:6px;margin-bottom:14px}
.dots i{display:block;height:10px;border-radius:5px}
.count{flex:0 0 auto;background:var(--chip);border-radius:18px;padding:12px 18px;min-width:220px}
.count b{font-family:var(--title);font-size:34px;line-height:1;display:block}
.count span{color:var(--mute);font-size:14px;white-space:pre-line}

.wrap{max-width:1360px;margin:0 auto;padding:16px 24px 48px;display:grid;grid-template-columns:380px 1fr;gap:24px;align-items:start}
@media (max-width:980px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:6px 20px 20px;position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:980px){.panel{position:static;max-height:none}}
.sec{padding:16px 0 14px;border-bottom:1.5px dashed var(--line)}
.sec:last-child{border-bottom:0}
.sec h2{font-family:var(--title);font-size:21px;margin:0 0 10px}
.field{margin-bottom:12px}
.field label.lab{display:block;font-size:15px;color:var(--mute);margin-bottom:6px}
.field input[type=text]{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px}
.seg button[aria-pressed=true]{background:var(--sun);border-color:var(--sun);color:#2E2B36;font-weight:700}
.doms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dom{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;cursor:pointer;background:var(--bg);text-align:left}
.dom .sw{width:16px;height:16px;border-radius:50%;flex:0 0 auto;border:2px solid currentColor}
.dom small{display:block;color:var(--mute);font-size:12.5px;line-height:1.3}
.dom[aria-pressed=true]{border-color:currentColor}
.dom[aria-pressed=true] .sw{background:currentColor}
.dom b{color:var(--ink);font-size:15px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.checks label{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--mint)}
.hint{font-size:13.5px;color:var(--mute);margin:6px 0 0}
.reroll{width:100%;margin-top:4px;border:0;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px;font-weight:700;cursor:pointer}
.dl{display:grid;gap:8px}
.dl button{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 14px;cursor:pointer;text-align:left}
.dl button b{font-size:16px}
.dl button span{font-size:13px;color:var(--mute)}
.dl button.main{background:var(--sun);border-color:var(--sun);color:#2E2B36}
.dl button.main span{color:#5a4a1a}
.dl button[disabled]{opacity:.5;cursor:progress}
.dl button.hide{display:none}
.tip{font-size:13.5px;color:var(--mute);background:var(--chip);border-radius:12px;padding:10px 12px;margin-top:10px}

.stage{background:var(--stage);border-radius:24px;padding:20px 18px 28px;min-height:60vh}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 4px 16px}
.bar h2{font-family:var(--title);font-size:22px;margin:0}
.spreads{display:flex;flex-direction:column;align-items:center;gap:26px}
.spread{display:flex;flex-direction:column;align-items:center;gap:6px}
.sheet{display:flex;filter:drop-shadow(0 6px 14px rgba(40,50,70,.16))}
.sheet.two .holder:first-child .page{border-right:1px solid #E8E3DA}
.cap{font-size:13px;color:var(--mute)}
.holder{overflow:hidden}
.page{position:relative;background:#fff;overflow:hidden;transform-origin:0 0;color:#2E2B36;font-family:var(--body)}
.page .it{position:absolute}
.page .tx{white-space:pre-wrap;word-break:break-all;line-height:1.45}
.page .tx.mid{display:flex;align-items:center}
.page .tx.mid.c{justify-content:center;text-align:center}
.page .tx.mid.r{justify-content:flex-end;text-align:right}
.page .tx.c{text-align:center}.page .tx.r{text-align:right}
.offscreen{position:fixed;left:-10000px;top:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="dots" aria-hidden="true">
      <i style="width:46px;background:var(--sky)"></i><i style="width:22px;background:var(--coral)"></i><i style="width:34px;background:var(--sun)"></i><i style="width:14px;background:var(--mint)"></i><i style="width:28px;background:var(--grape)"></i><i style="width:18px;background:var(--teal)"></i>
    </div>
    <h1>認知手冊生成器</h1>
    <p>選好天數和練習內容，做出一本長輩帶回家、每天一頁的動腦手冊。封面、使用說明、完成紀錄和答案都會自動編排好。</p>
  </div>
  <div class="count" aria-live="polite"><b id="pc">0 頁</b><span id="pcs"></span></div>
</header>

<main class="wrap">
  <aside class="panel" aria-label="手冊設定">
    <section class="sec">
      <h2>手冊資料</h2>
      <div class="field"><label class="lab" for="title">手冊名稱</label><input type="text" id="title" value="我的動腦手冊" maxlength="20"></div>
      <div class="field"><label class="lab" for="subtitle">副標題（可留空）</label><input type="text" id="subtitle" placeholder="每天動動腦　共 14 天的練習" maxlength="30"></div>
      <div class="field"><label class="lab" for="org">單位名稱（印在封面與證書）</label><input type="text" id="org" placeholder="例如：某某社區關懷據點" maxlength="30"></div>
    </section>
    <section class="sec">
      <h2>練習內容</h2>
      <div class="field"><span class="lab" style="display:block;font-size:15px;color:var(--mute);margin-bottom:6px">練習天數</span><div class="seg" data-k="days"><button data-v="7">7 天</button><button data-v="14">14 天</button><button data-v="21">21 天</button><button data-v="28">28 天</button></div></div>
      <div class="field"><span class="lab" style="display:block;font-size:15px;color:var(--mute);margin-bottom:6px">每天幾題</span><div class="seg" data-k="perDay"><button data-v="1">1 題</button><button data-v="2">2 題</button><button data-v="3">3 題</button></div><p class="hint" id="perHint"></p></div>
      <div class="field"><span class="lab" style="display:block;font-size:15px;color:var(--mute);margin-bottom:6px">練習哪些能力（會輪流出現）</span><div class="doms" id="doms"></div></div>
      <div class="field"><span class="lab" style="display:block;font-size:15px;color:var(--mute);margin-bottom:6px">難度</span><div class="seg" data-k="level"><button data-v="grow">由淺入深</button><button data-v="1">入門</button><button data-v="2">中等</button><button data-v="3">挑戰</button></div></div>
      <button class="reroll" id="reroll" type="button">換一組題目</button>
    </section>
    <section class="sec">
      <h2>版面</h2>
      <div class="field"><div class="seg" data-k="format"><button data-v="A5">A5 小冊子（可對摺）</button><button data-v="A4">A4 單頁</button></div></div>
      <div class="field"><span class="lab" style="display:block;font-size:15px;color:var(--mute);margin-bottom:6px">字的大小</span><div class="seg" data-k="fontScale"><button data-v="1">大</button><button data-v="1.15">特大</button></div></div>
      <span class="lab" style="display:block;font-size:15px;color:var(--mute);margin-bottom:8px">放進手冊的頁面</span>
      <div class="checks" id="checks"></div>
    </section>
    <section class="sec">
      <h2>下載</h2>
      <div class="dl">
        <button class="main" id="dlPpt" type="button"><b>PowerPoint</b><span>可改字、改顏色、移動位置</span></button>
        <button id="dlDoc" type="button"><b>Word</b><span>可編輯的文字與表格</span></button>
        <button id="dlPdf" type="button"><b>PDF 逐頁</b><span>直接列印或傳給家屬</span></button>
        <button id="dlBook" type="button"><b>PDF 摺頁小冊</b><span>A4 橫印，對摺就成冊</span></button>
      </div>
      <p class="tip" id="printTip"></p>
    </section>
  </aside>

  <section class="stage" aria-label="手冊預覽">
    <div class="bar"><h2>預覽</h2><div class="seg" data-k="view"><button data-v="spread">翻書看</button><button data-v="single">一頁一頁看</button></div></div>
    <div class="spreads" id="preview"></div>
  </section>
</main>
<div class="offscreen" id="off" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>
<script>
/* ===== 認知手冊生成器 核心：出題、頁面、版面 ===== */
const K = 0.3528; // pt -> mm
const LH = 1.45;

function rngOf(seed) {
  let a = seed >>> 0;
  const r = () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.int = (lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.shuffle = arr => { const b = arr.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  r.sample = (arr, n) => r.shuffle(arr).slice(0, n);
  return r;
}

function makeDecks(r) {
  const decks = {};
  const draw = (key, arr) => {
    let d = decks[key];
    if (!d || !d.length) { const last = d && d.last; d = decks[key] = r.shuffle(arr.map((_, i) => i)); if (last != null && d.length > 1 && d[d.length - 1] === last) d.unshift(d.pop()); }
    const i = d.pop(); d.last = i; return arr[i];
  };
  const drawN = (key, arr, n) => { const out = [], seen = new Set(); let guard = 0; while (out.length < Math.min(n, arr.length) && guard++ < n * 6) { const v = draw(key, arr), s = JSON.stringify(v); if (!seen.has(s)) { seen.add(s); out.push(v); } } return out; };
  return { draw, drawN };
}

    ];
    const seqs = ctx.drawN('pat' + lv, pool, lv === 1 ? 2 : 3).map(f => f());
    return T('找規律', '每一排數字都有規律，想一想，把空格填完。', [{ type: 'seq', rows: seqs.map(s => s.map((n, i) => i >= s.length - 2 ? '' : String(n))) }], '找規律：' + seqs.map(s => s.slice(-2).join('、')).join('；'));
  }
  if (v === 'shapePat') {
    const sy = r.sample(SYMBOLS.slice(0, 5), 4);
    const pats = lv === 1 ? [[0, 1], [0, 0, 1], [0, 1, 1]] : lv === 2 ? [[0, 1, 2], [0, 0, 1, 1], [0, 1, 0, 2]] : [[0, 1, 2, 3], [0, 1, 1, 2, 2, 2], [0, 1, 2, 1]];
    const rows = [], ans = [];
    r.sample(pats, 2).forEach(p => { const len = 8, s = Array.from({ length: len }, (_, i) => sy[p[i % p.length]]); rows.push(s.map((x, i) => i >= len - 2 ? '' : x)); ans.push(s.slice(-2).join('')); });
    return T('圖形規律', '看看圖形是怎麼排的，把最後兩格畫出來。', [{ type: 'seq', rows }], '圖形規律：' + ans.join('；'));
  }
  if (v === 'steps') {
    const [name, steps] = ctx.draw('steps', STEPS);
    const idx = lv === 1 ? [0, 2, 4] : lv === 2 ? [0, 1, 3, 4] : [0, 1, 2, 3, 4];
    const chosen = idx.map(i => steps[i]);
    let sh = r.shuffle(chosen), guard = 0;
    while (sh.join() === chosen.join() && guard++ < 10) sh = r.shuffle(chosen);
    return T('排排順序', `「${name}」的步驟被打亂了，請在方框裡寫上 1、2、3……排出正確順序。`, [{ type: 'steps', items: sh }], `排排順序（${name}）：` + chosen.join(' → '));
  }
  if (v === 'oddOne') {
    const k = lv === 1 ? 3 : 4, items = [], ans = [];
    const cats = Object.keys(WORDS).filter(c => c !== '地名');
    for (let i = 0; i < k; i++) {
      const [a, b] = ctx.drawN('oddcat', cats, 2);
      const same = r.sample(WORDS[a], lv === 3 ? 4 : 3), odd = r.pick(WORDS[b].filter(w => !WORDS[a].includes(w)));
      items.push({ label: String(i + 1), opts: r.shuffle(same.concat(odd)) }); ans.push(odd);
    }
    return T('哪一個不同類', '每一排有一個詞跟其他的不是同一類，把它圈起來，也可以說說看為什麼。', [{ type: 'choices', items }], '哪一個不同類：' + ans.join('、'));
  }
  if (v === 'match') {
    const [name, pairs] = ctx.draw('match', MATCH_SETS);
    const k = lv === 1 ? 3 : lv === 2 ? 4 : 5, ps = r.sample(pairs, k);
    const tags = ['甲', '乙', '丙', '丁', '戊'], right = r.shuffle(ps.map(p => p[1]));
    return T('配對看看', `把左邊和右邊配對（${name}），在括號裡寫上甲、乙、丙……`, [{ type: 'match', left: ps.map(p => p[0]), right: right.map((x, i) => `${tags[i]}　${x}`) }], '配對看看：' + ps.map(p => `${p[0]}－${tags[right.indexOf(p[1])]}`).join('、'));
  }
  if (v === 'pack') {
    const [name, yes, no] = ctx.draw('pack', PACK);
    const y = r.sample(yes, lv === 1 ? 3 : 4), n = r.sample(no, lv === 1 ? 2 : lv === 2 ? 3 : 4);
    return T('出門前想一想', `準備「${name}」，下面哪些東西用得到？把它們圈起來。`, [{ type: 'chips', items: r.shuffle(y.concat(n)) }, { type: 'lines', items: ['還想多帶什麼？＿＿＿＿＿＿＿＿'] }], `出門前想一想（${name}）：${y.join('、')}`);
  }
  return T('', '', [], '');
}

/* ---------- 建立整本手冊 ---------- */
function levelFor(mode, d, days) {
  if (mode !== 'grow') return +mode;
  const p = days <= 1 ? 0 : d / (days - 1);
  return p < 0.34 ? 1 : p < 0.67 ? 2 : 3;
}

function buildBook(opt) {
  const r = rngOf(opt.seed);
  const doms = DOMAIN_ORDER.filter(d => opt.domains.includes(d));
  const k = Math.min(opt.perDay, doms.length);
  const ctx = Object.assign({ lastMem: null, small: opt.format !== 'A4' }, makeDecks(r));
  const days = [];
  let rot = r.int(0, doms.length - 1);
  for (let d = 0; d < opt.days; d++) {
    const lv = levelFor(opt.level, d, opt.days);
    const todays = [];
    for (let j = 0; j < k; j++) { todays.push(doms[rot % doms.length]); rot++; }
    const recall = opt.recall && ctx.lastMem ? ctx.lastMem : null;
    ctx.lastMem = null;
    const tasks = todays.map(dom => genTask(dom, lv, r, ctx));
    days.push({ n: d + 1, week: Math.floor(d / 7) + 1, lv, tasks, recall });
  }
  const pages = [];
  const inc = opt.include;
  if (inc.cover) pages.push({ kind: 'cover' });
  if (inc.guide) pages.push({ kind: 'guide' });
  if (inc.toc) pages.push({ kind: 'toc' });
  if (inc.record) pages.push({ kind: 'record' });
  const weeks = Math.ceil(opt.days / 7);
  days.forEach(day => {
    pages.push({ kind: 'day', day });
    const endOfWeek = day.n % 7 === 0 || day.n === opt.days;
    if (inc.review && endOfWeek && opt.days >= 7) pages.push({ kind: 'review', week: day.week });
  });
  if (inc.answers) {
    const lines = [];
    days.forEach(day => {
      const ans = day.tasks.filter(t => !t.noAnswer).map(t => t.answer);
      if (day.recall) ans.unshift('回想昨天：' + day.recall.join('、'));
      if (ans.length) lines.push({ day: day.n, items: ans });
    });
    pages.push({ kind: 'answers', lines });
  }
  if (inc.cert) pages.push({ kind: 'cert' });
  return { opt, days, pages, weeks };
}

/* ---------- 版面 ---------- */
function geom(opt) {
  const fs = opt.fontScale || 1;
  if (opt.format === 'A4') return { W: 210, H: 297, M: 15, body: 18 * fs, cell: 18, fmt: 'A4' };
  return { W: 148, H: 210, M: 11, body: 13.5 * fs, cell: 13.5, fmt: 'A5' };
}
function units(s) { let u = 0; for (const ch of s) u += ch.charCodeAt(0) < 256 ? 0.56 : 1; return u; }
function textH(txt, pt, w) {
  const sz = pt * K; let lines = 0;
  String(txt).split('\n').forEach(l => { lines += Math.max(1, Math.ceil(units(l) * sz / (w * 0.985))); });
  return lines * sz * LH;
}

const C = { ink: '2E2B36', mute: '7A7486', line: 'BDB6AA', paper: 'FFF7E8', sun: 'FFC93C', coral: 'F0645A', mint: '2FA886', sky: '4C9BE8', grape: '9067D0' };

function Lay(G) {
  const items = [];
  const api = {
    items,
    T(x, y, w, txt, pt, o = {}) { const h = o.h || textH(txt, pt, w); items.push({ t: 'text', x, y, w, h, txt: String(txt), pt, b: !!o.b, c: o.c || C.ink, al: o.al || 'left', va: o.va || 'top', font: o.font || 'body' }); return h; },
    R(x, y, w, h, o = {}) { items.push({ t: 'rect', x, y, w, h, fill: o.fill || null, line: o.line || null, lw: o.lw || 0.4, r: o.r || 0, dash: !!o.dash }); },
    E(x, y, w, h, o = {}) { items.push({ t: 'ellipse', x, y, w, h, fill: o.fill || null, line: o.line || null, lw: o.lw || 0.4 }); },
    L(x, y, x2, y2, o = {}) { items.push({ t: 'line', x, y, x2, y2, c: o.c || C.line, lw: o.lw || 0.4, dash: !!o.dash }); },
  };
  return api;
}

// 區塊排版；回傳高度
function layBlock(Lr, b, x, y, w, G, f) {
  const ff = f >= 0.8 ? 1 : Math.max(0.86, f + 0.18), bp = G.body * ff, lh = bp * K * LH, sf = Math.max(0.72, f);
  if (b.type === 'chars') {
    const cell = Math.min(w / b.cols, G.cell * 1.2 * f);
    const gw = cell * b.cols, x0 = x + (w - gw) / 2;
    Lr.R(x0, y, gw, cell * b.rows, { fill: 'FFFFFF', line: C.line, lw: 0.5, r: 1.5 });
    b.chars.forEach((ch, i) => {
      const cx = x0 + (i % b.cols) * cell, cy = y + Math.floor(i / b.cols) * cell;
      if (i % b.cols) Lr.L(cx, cy, cx, cy + cell, { c: 'E2DCD1', lw: 0.3 });
      if (Math.floor(i / b.cols) && i % b.cols === 0) Lr.L(x0, cy, x0 + gw, cy, { c: 'E2DCD1', lw: 0.3 });
      Lr.T(cx, cy, cell, ch, cell * 0.6 / K, { h: cell, al: 'center', va: 'middle', font: 'body' });
    });
    return cell * b.rows + 2.5;
  }
  if (b.type === 'chips') {
    let cx = x, cy = y; const ch = bp * K * 1.9, gap = 2.6, pad = bp * K * 0.9;
    if (b.label) { const lw2 = units(b.label + '：') * bp * 0.85 * K + 1; Lr.T(cx, cy, lw2 + 2, b.label + '：', bp * 0.85, { h: ch, va: 'middle', c: C.mute }); cx += lw2 + 2; }
    b.items.forEach(it => {
      const cw = units(it) * bp * 1.05 * K + pad * 2;
      if (cx + cw > x + w) { cx = x + (b.label ? units(b.label + '：') * bp * 0.85 * K + 3 : 0); cy += ch + gap; }
      Lr.R(cx, cy, cw, ch, { fill: C.paper, line: 'E9D9B8', lw: 0.4, r: ch / 2 });
      Lr.T(cx, cy, cw, it, bp * 1.05, { h: ch, al: 'center', va: 'middle', b: true });
      cx += cw + gap;
    });
    return cy + ch - y + 3;
  }
  if (b.type === 'blanks') {
    const cols = b.cols || 1, rows = Math.ceil(b.n / cols), rh = bp * K * 2.25 * sf, cw = w / cols;
    for (let i = 0; i < b.n; i++) {
      const cx = x + (i % cols) * cw, cy = y + Math.floor(i / cols) * rh;
      const nw = units(String(i + 1) + '.') * bp * K + 1.5;
      Lr.T(cx, cy + rh - lh - 0.6, nw + 1, (i + 1) + '.', bp * 0.9, { c: C.mute });
      Lr.L(cx + nw + 1, cy + rh - 0.8, cx + cw - 4, cy + rh - 0.8, { c: '9E968A', lw: 0.4 });
    }
    return rows * rh + 2;
  }
  if (b.type === 'lines') {
    const rh = Math.max(lh, bp * K * 2.1 * sf); let h = 0;
    b.items.forEach(it => {
      const s = typeof it === 'string' ? it : it.t, th = textH(s, bp, w);
      if (typeof it === 'object' && it.q) { Lr.T(x, y + h + 1, w, s, bp); h += th + 1.5; return; }
      Lr.T(x, y + h + (rh - lh) / 2, w, s, bp); h += Math.max(rh, th + 1);
    });
    return h + 1;
  }
  if (b.type === 'choices') {
    const rh = Math.max(lh, bp * K * 2.1 * sf); let h = 0; const d = bp * K * 0.85;
    b.items.forEach(row => {
      const lw2 = units(row.label + '：') * bp * K + 1;
      Lr.T(x, y + h + (rh - lh) / 2, lw2 + 2, row.label + '：', bp);
      let cx = x + lw2 + 2;
      row.opts.forEach(o => {
        Lr.E(cx, y + h + (rh - d) / 2, d, d, { line: C.ink, lw: 0.45 });
        const ow = units(o) * bp * K + 1;
        Lr.T(cx + d + 1.2, y + h + (rh - lh) / 2, ow + 1, o, bp);
        cx += d + ow + 5;
      });
      h += rh;
    });
    return h + 1;
  }
  if (b.type === 'table') {
    const tw = Math.min(w, G.fmt === 'A4' ? 130 : 100), x0 = x, rh = Math.max(lh, bp * K * 2.0 * sf), c1 = tw * 0.62;
    const all = [b.head].concat(b.rows);
    Lr.R(x0, y, tw, rh, { fill: 'FDF1D9' });
    all.forEach((row, i) => {
      const cy = y + i * rh;
      Lr.T(x0 + 3, cy, c1 - 4, row[0], bp, { h: rh, va: 'middle', b: i === 0 });
      Lr.T(x0 + c1, cy, tw - c1 - 3, row[1], bp, { h: rh, va: 'middle', al: 'right', b: i === 0 });
      if (i) Lr.L(x0, cy, x0 + tw, cy, { c: 'E2DCD1', lw: 0.3 });
    });
    Lr.L(x0 + c1, y, x0 + c1, y + all.length * rh, { c: 'E2DCD1', lw: 0.3 });
    Lr.R(x0, y, tw, all.length * rh, { line: C.line, lw: 0.5, r: 1.5 });
    return all.length * rh + 2.5;
  }
  if (b.type === 'seq') {
    let h = 0;
    b.rows.forEach(row => {
      const gap = 2, bw = Math.min((w - gap * (row.length - 1)) / row.length, bp * K * 3.4 * f + 2);
      row.forEach((v, i) => {
        const bx = x + i * (bw + gap);
        Lr.R(bx, y + h, bw, bw * 0.85, { fill: v ? 'FFFFFF' : null, line: v ? C.line : '6E8FA6', lw: v ? 0.45 : 0.6, r: 1.5, dash: !v });
        if (v) Lr.T(bx, y + h, bw, v, bp * 1.1, { h: bw * 0.85, al: 'center', va: 'middle', b: true });
      });
      h += bw * 0.85 + 3;
    });
    return h;
  }
  if (b.type === 'steps') {
    const rh = Math.max(lh, bp * K * 2.25 * sf), bs = bp * K * 1.55; let h = 0;
    b.items.forEach(s => {
      Lr.R(x, y + h + (rh - bs) / 2, bs, bs, { line: C.ink, lw: 0.5, r: 1 });
      Lr.T(x + bs + 3, y + h + (rh - lh) / 2, w - bs - 3, s, bp);
      h += rh;
    });
    return h + 1;
  }
  if (b.type === 'para') {
    const pp = bp * 1.05, h = textH(b.text, pp, w - 8) + 6;
    Lr.R(x, y, w, h, { fill: 'FFFFFF', line: C.line, lw: 0.45, r: 2 });
    Lr.T(x + 4, y + 3, w - 8, b.text, pp, { b: true });
    return h + 2;
  }
  if (b.type === 'match') {
    const rh = Math.max(lh * 1.05, bp * K * 2.2 * sf), cw = w / 2, bs = bp * K * 1.5;
    const n = Math.max(b.left.length, b.right.length);
    for (let i = 0; i < n; i++) {
      const cy = y + i * rh;
      if (b.left[i]) { Lr.T(x, cy + (rh - lh) / 2, cw - bs - 6, `${i + 1}. ${b.left[i]}`, bp, { b: true }); Lr.R(x + cw - bs - 6, cy + (rh - bs) / 2, bs * 1.6, bs, { line: C.ink, lw: 0.45, r: 1 }); }
      if (b.right[i]) Lr.T(x + cw + 2, cy + (rh - lh) / 2, cw - 2, b.right[i], bp);
    }
    return n * rh + 1;
  }
  if (b.type === 'grid2') {
    const rh = Math.max(lh * 1.15, bp * K * 2.3 * sf), cw = w / 2; let h = 0;
    b.items.forEach((s, i) => {
      const cx = x + (i % 2) * cw, cy = y + Math.floor(i / 2) * rh;
      Lr.T(cx, cy + (rh - lh * 1.1) / 2, cw - 2, s, bp * 1.1, { b: true });
    });
    return Math.ceil(b.items.length / 2) * rh + 1;
  }
  return 0;
}

function pill(Lr, x, y, txt, pt, fill, color) {
  const h = pt * K * 1.75, w = units(txt) * pt * K + pt * K * 1.6;
  Lr.R(x, y, w, h, { fill, r: h / 2 });
  Lr.T(x, y, w, txt, pt, { h, al: 'center', va: 'middle', b: true, c: color || 'FFFFFF' });
  return [w, h];
}

function footer(Lr, G, pageNo) {
  const { W, H, M } = G; const bp = G.body;
  if (pageNo) Lr.T(0, H - M + 1.5, W, String(pageNo), bp * 0.75, { al: 'center', c: C.mute });
}

function layoutDay(page, G, f) {
  const Lr = Lay(G); const { W, H, M } = G; const day = page.day;
  const bp = G.body; const x = M, w = W - 2 * M;
  let y = M - 1;
  const [tw, th] = pill(Lr, x, y, day.cont ? `第 ${day.n} 天（續）` : `第 ${day.n} 天`, bp * 1.35, C.sun, C.ink);
  const hasOri = day.cont || day.tasks.some(t => t.ori);
  const right = hasOri ? `第 ${day.week} 週` : `＿＿ 月 ＿＿ 日　星期 ＿＿`;
  Lr.T(x + tw + 4, y + (th - bp * K * LH) / 2, w - tw - 4, right, bp * (hasOri ? 0.9 : 1), { al: 'right', c: hasOri ? C.mute : C.ink });
  y += th + 3.5;
  if (day.recall) {
    const hh = bp * K * LH, bh = hh * 2 + 7;
    Lr.R(x, y, w, bh, { fill: 'FDE9E7', r: 2.5 });
    Lr.T(x + 4, y + 3, w - 8, '回想一下：昨天記的詞，還記得哪些？說說看或寫在旁邊。', bp * 0.95, { b: true, c: '9A3A32' });
    Lr.T(x + 4, y + 3 + hh + 1, w - 8, `昨天共有 ${day.recall.length} 個詞，我記得 ＿＿ 個。`, bp * 0.95);
    y += bh + 4;
  }
  day.tasks.forEach((t, i) => {
    const D = DOMAINS[t.dom];
    const [pw, ph] = pill(Lr, x, y, D.name, bp * 0.8, D.color);
    Lr.T(x + pw + 3, y + (ph - bp * 1.15 * K * LH) / 2, w - pw - 3, t.title, bp * 1.15, { b: true, font: 'title' });
    y += ph + 2.5;
    y += Lr.T(x, y, w, t.guide, bp * (f >= 0.8 ? 1 : Math.max(0.86, f + 0.18))) + 2.5;
    t.blocks.forEach(b => { y += layBlock(Lr, b, x, y, w, G, f) + 1.5; });
    if (i < day.tasks.length - 1) { y += 2.5 * f; Lr.L(x, y, x + w, y, { c: 'E2DCD1', lw: 0.4, dash: true }); y += 4 * f; }
  });
  const fh = bp * K * 2.4, fy = H - M - fh - 1;
  if (day.more) { Lr.T(x, fy + (fh - bp * K * LH) / 2, w, '翻到下一頁，還有一題喔！', bp, { al: 'right', c: C.mute, b: true }); footer(Lr, G, page.no); return { items: Lr.items, used: y, limit: fy - 2 }; }
  // 底部：完成紀錄
  Lr.R(x, fy, w, fh, { fill: C.paper, r: fh / 2 });
  const d = bp * K * 0.95, ty = fy + (fh - bp * K * LH) / 2;
  let cx = x + 5;
  Lr.R(cx, fy + (fh - d) / 2, d, d, { line: C.ink, lw: 0.5, r: 0.6 }); cx += d + 1.5;
  Lr.T(cx, ty, 20, '完成了', bp, {}); cx += units('完成了') * bp * K + 6;
  Lr.T(cx, ty, 20, '心情：', bp, { c: C.mute }); cx += units('心情：') * bp * K + 0.5;
  ['很好', '還好', '有點累'].forEach(o => { Lr.E(cx, fy + (fh - d) / 2, d, d, { line: C.ink, lw: 0.45 }); cx += d + 1; Lr.T(cx, ty, 20, o, bp); cx += units(o) * bp * K + 3.5; });
  footer(Lr, G, page.no);
  return { items: Lr.items, used: y, limit: fy - 2 };
}

function layoutPage(page, book, G) {
  if (page.kind === 'day') {
    let f = 1, res;
    for (let i = 0; i < 9; i++) { res = layoutDay(page, G, f); if (res.used <= res.limit) break; f -= 0.06; }
    return res.items;
  }
  const Lr = Lay(G); const { W, H, M } = G; const bp = G.body; const x = M, w = W - 2 * M; const o = book.opt;
  const title = o.title || '我的動腦手冊';
  if (page.kind === 'cover') {
    // 裝飾圓點
    const s = W / 148;
    Lr.E(W - 62 * s, -18 * s, 80 * s, 80 * s, { fill: 'FFE7A3' });
    Lr.E(-20 * s, H - 70 * s, 70 * s, 70 * s, { fill: 'D8EEF9' });
    Lr.E(W - 40 * s, H - 46 * s, 26 * s, 26 * s, { fill: 'FCD5D0' });
    Lr.E(18 * s, 26 * s, 12 * s, 12 * s, { fill: C.coral });
    Lr.E(34 * s, 20 * s, 7 * s, 7 * s, { fill: C.mint });
    Lr.E(W - 30 * s, 64 * s, 9 * s, 9 * s, { fill: C.sky });
    // 六色條
    const bw = (w) / 6;
    DOMAIN_ORDER.forEach((k2, i) => Lr.R(x + i * bw, 52 * s, bw - 1.5 * s, 4 * s, { fill: DOMAINS[k2].color, r: 2 * s }));
    let y = 64 * s;
    y += Lr.T(x, y, w, title, bp * 2.5, { b: true, font: 'title' }) + 3 * s;
    y += Lr.T(x, y, w, o.subtitle || `每天動動腦　共 ${o.days} 天的練習`, bp * 1.15, { c: C.mute }) + 14 * s;
    const fields = ['姓名', '開始日期'];
    fields.forEach(fl => {
      const lw2 = units(fl + '：') * bp * 1.1 * K;
      Lr.T(x, y, lw2 + 2, fl + '：', bp * 1.1);
      Lr.L(x + lw2 + 2, y + bp * 1.1 * K * LH, x + w * 0.85, y + bp * 1.1 * K * LH, { c: '9E968A', lw: 0.5 });
      y += bp * K * 3.2;
    });
    y += 6 * s;
    y += Lr.T(x, y, w, '這本手冊會練習：', bp * 0.95, { c: C.mute }) + 2.5;
    let cx = x;
    DOMAIN_ORDER.filter(k2 => o.domains.includes(k2)).forEach(k2 => {
      const pw = units(DOMAINS[k2].name) * bp * K + bp * K * 1.6;
      if (cx + pw > x + w) { cx = x; y += bp * K * 2.3; }
      pill(Lr, cx, y, DOMAINS[k2].name, bp, DOMAINS[k2].color);
      cx += pw + 2.5;
    });
    if (o.org) Lr.T(x, H - M - bp * K * LH * 2, w, o.org, bp * 0.9, { c: C.mute });
    return Lr.items;
  }
  if (page.kind === 'guide') {
    let y = M;
    y += Lr.T(x, y, w, '怎麼使用這本手冊', bp * 1.5, { b: true, font: 'title' }) + 4;
    const steps = ['每天找一個固定的時間，大約十五分鐘，坐在光線充足的桌子前。', '一天做一頁就好，不用趕進度；漏了一天，隔天接著做。', '先把題目唸出來再開始，慢慢做，不會的題目可以先跳過。', '寫完在頁面下方打勾，再到「完成紀錄表」把當天的數字圈起來。'];
    steps.forEach((s2, i) => {
      const d = bp * K * 1.7;
      Lr.E(x, y, d, d, { fill: C.sun });
      Lr.T(x, y, d, String(i + 1), bp * 0.9, { h: d, al: 'center', va: 'middle', b: true });
      y += Math.max(d, Lr.T(x + d + 3, y + (d - bp * K * LH) / 2, w - d - 3, s2, bp)) + 3.5;
    });
    y += 3;
    const tips = ['陪伴比答對更重要，多說一句「做得很好」。', '寫錯了不用急著糾正，可以一起再看一次。', '答案在手冊最後，可以陪長輩一起對答案。', '覺得太難或太累就先休息，明天再繼續。'];
    let bh = bp * K * LH * 1.15 + 6; tips.forEach(t => { bh += textH('・' + t, bp * 0.95, w - 10) + 2; });
    Lr.R(x, y, w, bh, { fill: 'E2F5EF', r: 3 });
    let yy = y + 4;
    yy += Lr.T(x + 5, yy, w - 10, '給家人的小提醒', bp * 1.05, { b: true, c: '1F7A60' }) + 2;
    tips.forEach(t => { yy += Lr.T(x + 5, yy, w - 10, '・' + t, bp * 0.95) + 2; });
    y += bh + 5;
    Lr.T(x, y, w, '這本手冊是日常的動腦練習。如果發現記憶或生活能力明顯變差，請找醫師或職能治療師討論。', bp * 0.78, { c: C.mute });
    footer(Lr, G, page.no);
    return Lr.items;
  }
  if (page.kind === 'toc') {
    let y = M;
    y += Lr.T(x, y, w, '目錄', bp * 1.5, { b: true, font: 'title' }) + 5;
    page.entries.forEach(e => {
      const rh = bp * K * 2.2;
      Lr.T(x, y, w * 0.75, e[0], bp);
      Lr.T(x + w * 0.75, y, w * 0.25, String(e[1]), bp, { al: 'right', b: true });
      Lr.L(x, y + rh - 1.5, x + w, y + rh - 1.5, { c: 'E2DCD1', lw: 0.3, dash: true });
      y += rh;
    });
    footer(Lr, G, page.no);
    return Lr.items;
  }
  if (page.kind === 'record') {
    let y = M;
    y += Lr.T(x, y, w, '完成紀錄表', bp * 1.5, { b: true, font: 'title' }) + 2;
    y += Lr.T(x, y, w, '每完成一天，就把那一天的數字圈起來，或貼一張貼紙。', bp) + 5;
    const cols = 7, gap = 2.2, d = Math.min((w - gap * (cols - 1)) / cols, bp * K * 3.4);
    const gx = x + (w - (d * cols + gap * (cols - 1))) / 2;
    const weeks = Math.ceil(o.days / 7);
    for (let wk = 0; wk < weeks; wk++) {
      y += Lr.T(x, y, w, `第 ${wk + 1} 週`, bp * 0.95, { b: true, c: C.mute }) + 1.5;
      for (let i = 0; i < 7 && wk * 7 + i < o.days; i++) {
        const n = wk * 7 + i + 1, cx = gx + i * (d + gap);
        Lr.E(cx, y, d, d, { fill: 'FFFFFF', line: DOMAINS[DOMAIN_ORDER[wk % 6]].color, lw: 0.7 });
        Lr.T(cx, y, d, String(n), bp * 1.05, { h: d, al: 'center', va: 'middle', b: true });
      }
      y += d + 4;
    }
    y += 3;
    const lw2 = units('全部完成後，我想給自己的獎勵：') * bp * K;
    Lr.T(x, y, w, '全部完成後，我想給自己的獎勵：', bp);
    y += bp * K * LH * (lw2 > w ? 2 : 1) + bp * K * 1.6;
    Lr.L(x, y, x + w, y, { c: '9E968A', lw: 0.5 });
    footer(Lr, G, page.no);
    return Lr.items;
  }
  if (page.kind === 'review') {
    let y = M;
    pill(Lr, x, y, `第 ${page.week} 週回顧`, bp * 1.35, C.mint);
    y += bp * 1.35 * K * 1.75 + 6;
    const qs = ['這一週我完成了 ＿＿ 天', '我最喜歡的題目是：', '我覺得最難的是：', '這一週讓我開心的事：', '家人想對我說：'];
    const rh = bp * K * 2.3, hq = bp * K * LH, gapq = bp * K * 1.4;
    y += Lr.T(x, y, w, qs[0], bp) + gapq;
    const avail = H - M - 8 - y - 4 * (hq + gapq);
    const per = Math.max(1, Math.floor(avail / 4 / rh));
    qs.slice(1).forEach(q => {
      y += Lr.T(x, y, w, q, bp, { b: true });
      for (let j = 0; j < per; j++) { y += rh; Lr.L(x, y, x + w, y, { c: '9E968A', lw: 0.45 }); }
      y += gapq;
    });
    footer(Lr, G, page.no);
    return Lr.items;
  }
  if (page.kind === 'answers') {
    let y = M;
    y += Lr.T(x, y, w, page.cont ? '答案（續）' : '答案（給家人參考）', bp * 1.4, { b: true, font: 'title' }) + 1.5;
    if (!page.cont) y += Lr.T(x, y, w, '「今天的我」與「想一想」沒有標準答案，合理就給予肯定。', bp * 0.8, { c: C.mute }) + 3;
    const ap = bp * 0.82;
    page.lines.forEach(l => {
      const lab = `第 ${l.day} 天`; const lw2 = units(lab) * ap * K + 4;
      Lr.T(x, y, lw2, lab, ap, { b: true, c: '9A6A00' });
      let yy = y; l.items.forEach(s2 => { yy += Lr.T(x + lw2, yy, w - lw2, s2, ap) + 0.6; });
      y = yy + 2;
    });
    footer(Lr, G, page.no);
    return Lr.items;
  }
  if (page.kind === 'cert') {
    const s = W / 148;
    Lr.R(x - 2, M - 2, w + 4, H - 2 * M + 4, { line: C.sun, lw: 1.6, r: 5 });
    Lr.R(x + 1.5, M + 1.5, w - 3, H - 2 * M - 3, { line: 'F6DD94', lw: 0.6, r: 3.5 });
    Lr.E(W / 2 - 16 * s, M + 16 * s, 32 * s, 32 * s, { fill: 'FFE7A3' });
    Lr.E(W / 2 - 9 * s, M + 23 * s, 18 * s, 18 * s, { fill: C.sun });
    let y = M + 58 * s;
    y += Lr.T(x, y, w, '完成證書', bp * 2.1, { b: true, al: 'center', font: 'title' }) + 8 * s;
    y += Lr.T(x + 8, y, w - 16, `＿＿＿＿＿＿ 完成了 ${o.days} 天的動腦練習。`, bp * 1.1, { al: 'center' }) + 4;
    y += Lr.T(x + 8, y, w - 16, '每一天的努力都值得被肯定，繼續保持！', bp * 1.1, { al: 'center' }) + 16 * s;
    Lr.T(x + 8, y, w - 16, '日期：＿＿ 年 ＿＿ 月 ＿＿ 日', bp, { al: 'center' });
    y += bp * K * 3;
    Lr.T(x + 8, y, w - 16, '頒發人：＿＿＿＿＿＿', bp, { al: 'center' });
    if (o.org) Lr.T(x, H - M - 14 * s, w, o.org, bp * 0.85, { al: 'center', c: C.mute });
    return Lr.items;
  }
  if (page.kind === 'notes') {
    let y = M;
    y += Lr.T(x, y, w, '筆記', bp * 1.4, { b: true, font: 'title' }) + 4;
    const rh = bp * K * 2.2;
    while (y + rh < H - M - 6) { y += rh; Lr.L(x, y, x + w, y, { c: 'D9D2C6', lw: 0.4 }); }
    footer(Lr, G, page.no);
    return Lr.items;
  }
  return Lr.items;
}

// 分頁答案、加筆記頁、編頁碼、建目錄
function finalize(book) {
  const G = geom(book.opt);
  const out = [];
  book.pages.forEach(p => {
    if (p.kind !== 'answers') { out.push(p); return; }
    const bp = G.body, ap = bp * 0.82, w = G.W - 2 * G.M;
    let cur = { kind: 'answers', lines: [] }, y = G.M + bp * 1.4 * K * LH + 1.5 + textH('x', bp * 0.8, w) + 3;
    const limit = G.H - G.M - 8;
    p.lines.forEach(l => {
      const lw2 = units('第 99 天') * ap * K + 4;
      const h = l.items.reduce((s, it) => s + textH(it, ap, w - lw2) + 0.6, 0) + 2;
      if (y + h > limit && cur.lines.length) { out.push(cur); cur = { kind: 'answers', lines: [], cont: true }; y = G.M + bp * 1.4 * K * LH + 4; }
      cur.lines.push(l); y += h;
    });
    out.push(cur);
  });
  // 一天內容太多時，自動接到下一頁
  for (let i = 0; i < out.length; i++) {
    const p = out[i];
    if (p.kind !== 'day' || p.day.tasks.length < 2) continue;
    const fits = pg => { const r = layoutDay(pg, G, 0.64); return r.used <= r.limit; };
    if (fits(p)) continue;
    let k = p.day.tasks.length - 1;
    while (k > 1 && !fits({ kind: 'day', day: Object.assign({}, p.day, { tasks: p.day.tasks.slice(0, k) }) })) k--;
    const d1 = Object.assign({}, p.day, { tasks: p.day.tasks.slice(0, k), more: true });
    const d2 = Object.assign({}, p.day, { tasks: p.day.tasks.slice(k), recall: null, cont: true });
    out.splice(i, 1, { kind: 'day', day: d1 }, { kind: 'day', day: d2 });
  }
  if (book.opt.format === 'A5' && book.opt.booklet !== false) {
    const lastIsCert = out.length && out[out.length - 1].kind === 'cert';
    while (out.length % 4) out.splice(lastIsCert ? out.length - 1 : out.length, 0, { kind: 'notes' });
  }
  out.forEach((p, i) => { p.no = p.kind === 'cover' || p.kind === 'cert' ? 0 : i + 1; });
  const toc = out.find(p => p.kind === 'toc');
  if (toc) {
    const e = []; const find = k2 => out.findIndex(p => p.kind === k2) + 1;
    if (find('guide')) e.push(['怎麼使用這本手冊', find('guide')]);
    if (find('record')) e.push(['完成紀錄表', find('record')]);
    for (let wk = 1; wk <= book.weeks; wk++) {
      const i = out.findIndex(p => p.kind === 'day' && p.day.week === wk);
      const a = (wk - 1) * 7 + 1, b = Math.min(wk * 7, book.opt.days);
      e.push([`第 ${wk} 週（第 ${a}–${b} 天）`, i + 1]);
    }
    if (find('answers')) e.push(['答案（給家人參考）', find('answers')]);
    if (find('cert')) e.push(['完成證書', find('cert')]);
    toc.entries = e;
  }
  book.pages = out;
  book.G = G;
  book.layouts = out.map(p => layoutPage(p, book, G));
  return book;
}

/* ---------- 匯出：PPTX（可編輯形狀與文字） ---------- */
const FONT_PPT = 'Microsoft JhengHei';
function exportPptx(book, PptxGenJS) {
  const G = book.G, pptx = new PptxGenJS(), I = v => v / 25.4;
  pptx.defineLayout({ name: 'BOOK', width: I(G.W), height: I(G.H) });
  pptx.layout = 'BOOK';
  pptx.title = book.opt.title || '我的動腦手冊';
  book.layouts.forEach(items => {
    const s = pptx.addSlide(); s.background = { color: 'FFFFFF' };
    items.forEach(it => {
      if (it.t === 'rect') {
        const o = { x: I(it.x), y: I(it.y), w: I(it.w), h: I(it.h), fill: it.fill ? { color: it.fill } : { type: 'none' }, line: it.line ? { color: it.line, width: it.lw * 2.835, dashType: it.dash ? 'dash' : 'solid' } : { type: 'none' } };
        if (it.r) o.rectRadius = I(it.r);
        s.addShape(it.r ? pptx.ShapeType.roundRect : pptx.ShapeType.rect, o);
      } else if (it.t === 'ellipse') {
        s.addShape(pptx.ShapeType.ellipse, { x: I(it.x), y: I(it.y), w: I(it.w), h: I(it.h), fill: it.fill ? { color: it.fill } : { type: 'none' }, line: it.line ? { color: it.line, width: it.lw * 2.835 } : { type: 'none' } });
      } else if (it.t === 'line') {
        const x = Math.min(it.x, it.x2), y = Math.min(it.y, it.y2);
        s.addShape(pptx.ShapeType.line, { x: I(x), y: I(y), w: I(Math.abs(it.x2 - it.x)), h: I(Math.abs(it.y2 - it.y)), line: { color: it.c, width: it.lw * 2.835, dashType: it.dash ? 'dash' : 'solid' } });
      } else if (it.t === 'text') {
        s.addText(it.txt, { x: I(it.x), y: I(it.y), w: I(it.w + 1.5), h: I(Math.max(it.h, 3)), fontFace: FONT_PPT, fontSize: Math.round(it.pt * 10) / 10, bold: it.b, color: it.c, align: it.al, valign: it.va, margin: 0, lineSpacing: it.pt * 1.3, fit: 'none', wrap: true });
      }
    });
  });
  return pptx;
}

    }

    if (b.type === 'blanks') { const out = []; for (let i = 0; i < b.n; i += 2) out.push(P(`${i + 1}. ＿＿＿＿＿＿＿＿` + (i + 1 < b.n ? `　　${i + 2}. ＿＿＿＿＿＿＿＿` : ''), bp, { line: 440, after: 60 })); return out; }

    else if (p.kind === 'toc') { children.push(P('目錄', bp * 1.5, { b: true, pb })); p.entries.forEach(e => children.push(P(`${e[0]}　……　${e[1]}`, bp))); }
    else if (p.kind === 'record') {
      children.push(P('完成紀錄表', bp * 1.5, { b: true, pb }), P('每完成一天，就把那一天的數字圈起來，或貼一張貼紙。', bp));
      for (let wk = 0; wk < book.weeks; wk++) { const nums = []; for (let i = 1; i <= 7 && wk * 7 + i <= o.days; i++) nums.push(String(wk * 7 + i)); children.push(P(`第 ${wk + 1} 週`, bp * 0.95, { b: true, c: C.mute })); children.push(new D.Table({ rows: [new D.TableRow({ height: { value: tw(13), rule: D.HeightRule.EXACT }, children: nums.map(n => cell(n, bp * 1.05, { w: tw(14), b: true })) })], columnWidths: Array(nums.length).fill(tw(14)), width: { size: tw(14) * nums.length, type: D.WidthType.DXA }, layout: D.TableLayoutType.FIXED }), P('', 6, { after: 80 })); }
      children.push(P('全部完成後，我想給自己的獎勵：', bp, { before: 200 }), P('＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿', bp));
    }
    else if (p.kind === 'day') {
      const day = p.day, hasOri = day.cont || day.tasks.some(t => t.ori);
      children.push(P([run(day.cont ? `第 ${day.n} 天（續）` : `第 ${day.n} 天`, bp * 1.35, { b: true }), run(hasOri || day.cont ? `　　第 ${day.week} 週` : '　　＿＿ 月 ＿＿ 日　星期 ＿＿', bp * 0.95, { c: hasOri ? C.mute : C.ink })], 0, { pb, shade: 'FFF2C7' }));
      if (day.recall) { children.push(P('回想一下：昨天記的詞，還記得哪些？說說看或寫在旁邊。', bp * 0.95, { b: true, c: '9A3A32', shade: 'FDE9E7' }), P(`昨天共有 ${day.recall.length} 個詞，我記得 ＿＿ 個。`, bp * 0.95, { shade: 'FDE9E7' })); }
      day.tasks.forEach(t => {
        const Dm = DOMAINS[t.dom];
        children.push(P([run(`【${Dm.name}】`, bp, { b: true, c: Dm.color }), run(t.title, bp * 1.15, { b: true })], 0, { before: 160 }));
        children.push(P(t.guide, bp));
        t.blocks.forEach(b => children.push(...blockDocx(b)));
      });
      children.push(day.more ? P('翻到下一頁，還有一題喔！', bp, { al: 'right', c: C.mute, before: 200 }) : P('□ 完成了　　心情：○很好　○還好　○有點累', bp, { shade: C.paper, before: 200 }));
    }
    else if (p.kind === 'review') { children.push(P(`第 ${p.week} 週回顧`, bp * 1.35, { b: true, pb, c: '1F7A60' }), P('這一週我完成了 ＿＿ 天', bp, { line: 480 })); ['我最喜歡的題目是：', '我覺得最難的是：', '這一週讓我開心的事：', '家人想對我說：'].forEach(q => children.push(P(q, bp, { b: true }), P('＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿', bp, { line: 480 }))); }
    else if (p.kind === 'answers') { children.push(P(p.cont ? '答案（續）' : '答案（給家人參考）', bp * 1.4, { b: true, pb })); if (!p.cont) children.push(P('「今天的我」與「想一想」沒有標準答案，合理就給予肯定。', bp * 0.8, { c: C.mute })); p.lines.forEach(l => children.push(P([run(`第 ${l.day} 天　`, bp * 0.82, { b: true, c: '9A6A00' }), run(l.items.join('；'), bp * 0.82)], 0, { after: 80, line: 300 }))); }
    else if (p.kind === 'cert') { children.push(P('', 10, { pb, after: 1400 }), P('完成證書', bp * 2.1, { b: true, al: 'center', after: 500 }), P(`＿＿＿＿＿＿ 完成了 ${o.days} 天的動腦練習。`, bp * 1.1, { al: 'center' }), P('每一天的努力都值得被肯定，繼續保持！', bp * 1.1, { al: 'center', after: 900 }), P('日期：＿＿ 年 ＿＿ 月 ＿＿ 日', bp, { al: 'center', after: 300 }), P('頒發人：＿＿＿＿＿＿', bp, { al: 'center' })); if (o.org) children.push(P(o.org, bp * 0.85, { al: 'center', c: C.mute, before: 600 })); }
    else if (p.kind === 'notes') { children.push(P('筆記', bp * 1.4, { b: true, pb })); for (let i = 0; i < 12; i++) children.push(P('＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿', bp, { c: 'BDB6AA', line: 480 })); }
  });
  return new D.Document({ creator: '認知手冊生成器', title: o.title || '我的動腦手冊', styles: { default: { document: { run: { font } } } }, sections: [{ properties: { page: { size: { width: tw(G.W), height: tw(G.H) }, margin: { top: tw(G.M), bottom: tw(G.M), left: tw(G.M), right: tw(G.M) } } }, children }] });
}

/* 摺頁排序：回傳 [[左,右], ...]（1-based 頁碼，正反面交替） */
function imposition(n) {
  const out = [];
  for (let s = 0; s < n / 4; s++) { out.push([n - 2 * s, 2 * s + 1]); out.push([2 * s + 2, n - 2 * s - 1]); }
  return out;
}

/* ===== 介面 ===== */
const DOM_DESC = { att: '找字、找數字、找圖形', mem: '看詞、短文、誰買了什麼', cal: '買菜、時間、湊錢、算式', ori: '日期、星期、節日、時鐘', lan: '補字、成語、相反詞、接龍', exe: '規律、排序、配對、分類' };
const PAGE_OPTS = [['cover', '封面'], ['guide', '使用說明'], ['toc', '目錄'], ['record', '完成紀錄表'], ['review', '每週回顧'], ['recall', '隔天回想昨天的詞'], ['answers', '答案頁'], ['cert', '完成證書']];
const state = { days: 14, perDay: 2, level: 'grow', format: 'A5', fontScale: 1, view: 'spread', domains: ['att', 'mem', 'cal', 'ori', 'lan', 'exe'], include: { cover: 1, guide: 1, toc: 1, record: 1, review: 1, answers: 1, cert: 1 }, recall: true, seed: (Date.now() % 1e9) | 0 };
let book = null;
const $ = id => document.getElementById(id);
const PX = 96 / 25.4;

function opts() {
  return { seed: state.seed, title: $('title').value.trim() || '我的動腦手冊', subtitle: $('subtitle').value.trim(), org: $('org').value.trim(), days: state.days, perDay: state.perDay, domains: state.domains, level: state.level, format: state.format, fontScale: state.fontScale, recall: state.recall, include: state.include };
}

function renderPage(items, G) {
  const pg = document.createElement('div');
  pg.className = 'page';
  pg.style.width = G.W + 'mm'; pg.style.height = G.H + 'mm';
  const frag = document.createDocumentFragment();
  items.forEach(it => {
    const d = document.createElement('div');
    d.className = 'it';
    if (it.t === 'line') {
      const hz = Math.abs(it.y2 - it.y) < 0.01;
      d.style.left = Math.min(it.x, it.x2) + 'mm'; d.style.top = Math.min(it.y, it.y2) + 'mm';
      const b = `${it.lw}mm ${it.dash ? 'dashed' : 'solid'} #${it.c}`;
      if (hz) { d.style.width = Math.abs(it.x2 - it.x) + 'mm'; d.style.borderTop = b; }
      else { d.style.height = Math.abs(it.y2 - it.y) + 'mm'; d.style.borderLeft = b; }
    } else {
      d.style.left = it.x + 'mm'; d.style.top = it.y + 'mm'; d.style.width = it.w + 'mm'; d.style.height = it.h + 'mm';
      if (it.t === 'rect' || it.t === 'ellipse') {
        if (it.fill) d.style.background = '#' + it.fill;
        if (it.line) d.style.border = `${it.lw}mm ${it.dash ? 'dashed' : 'solid'} #${it.line}`;
        d.style.borderRadius = it.t === 'ellipse' ? '50%' : it.r + 'mm';
      } else {
        d.className = 'it tx' + (it.va === 'middle' ? ' mid' : '') + (it.al === 'center' ? ' c' : it.al === 'right' ? ' r' : '');
        d.style.fontSize = it.pt + 'pt';
        d.style.color = '#' + it.c;
        d.style.fontWeight = it.b ? '700' : '400';
        d.style.fontFamily = it.font === 'title' ? 'var(--title)' : 'var(--body)';
        if (it.va === 'middle') { const s = document.createElement('span'); s.textContent = it.txt; d.appendChild(s); } else d.textContent = it.txt;
        d.style.width = (it.w + 1) + 'mm';
      }
    }
    frag.appendChild(d);
  });
  pg.appendChild(frag);
  return pg;
}

function pageLabel(p, i) {
  const map = { cover: '封面', guide: '使用說明', toc: '目錄', record: '完成紀錄表', review: `第 ${p.week} 週回顧`, answers: '答案', cert: '完成證書', notes: '筆記' };
  if (p.kind === 'day') return `第 ${p.day.n} 天${p.day.cont ? '（續）' : ''}`;
  return map[p.kind];
}

function drawPreview() {
  const box = $('preview'); box.innerHTML = '';
  const G = book.G, n = book.pages.length;
  const avail = box.clientWidth || 600;
  let groups = [];
  if (state.view === 'spread' && n > 1) {
    groups.push([0]);
    for (let i = 1; i < n - 1; i += 2) groups.push(i + 1 < n - 1 ? [i, i + 1] : [i]);
    if (n > 1) groups.push([n - 1]);
  } else groups = book.pages.map((_, i) => [i]);
  const spreadW = G.W * PX * 2, singleW = G.W * PX;
  const scale = Math.min(1, (avail - 8) / (state.view === 'spread' ? spreadW : singleW), state.view === 'spread' ? 1 : 0.9);
  groups.forEach(g => {
    const wrap = document.createElement('div'); wrap.className = 'spread';
    const sh = document.createElement('div'); sh.className = 'sheet' + (g.length === 2 ? ' two' : '');
    g.forEach(i => {
      const h = document.createElement('div'); h.className = 'holder';
      h.style.width = G.W * PX * scale + 'px'; h.style.height = G.H * PX * scale + 'px';
      const pg = renderPage(book.layouts[i], G); pg.style.transform = `scale(${scale})`;
      h.appendChild(pg); sh.appendChild(h);
    });
    const cap = document.createElement('div'); cap.className = 'cap';
    cap.textContent = g.map(i => `${i + 1}．${pageLabel(book.pages[i], i)}`).join('　　');
    wrap.appendChild(sh); wrap.appendChild(cap); box.appendChild(wrap);
  });
}

function rebuild() {
  book = finalize(buildBook(opts()));
  const n = book.pages.length;
  $('pc').textContent = `${n} 頁`;
  const kinds = new Set(book.days.flatMap(d => d.tasks.map(t => t.kind))).size;
  $('pcs').textContent = (state.format === 'A5' ? `印成小冊子需要 ${n / 4} 張 A4 紙（雙面）` : `A4 單面需要 ${n} 張紙`) + `\n共用了 ${kinds} 種題型`;
  $('perHint').textContent = state.perDay === 3 ? '一天三題時，放不下的題目會接到下一頁，頁數會變多。' : (state.format === 'A5' && state.fontScale > 1 && state.perDay > 1 ? 'A5 用特大字時，較長的題目會接到下一頁。' : '');
  $('dlBook').classList.toggle('hide', state.format !== 'A5');
  $('printTip').textContent = state.format === 'A5'
    ? '摺頁小冊：用 A4 橫向、雙面列印、選「短邊翻頁」，整疊對摺後在中線釘兩針。Word 檔可在「版面設定」選「書籍摺頁」列印。'
    : 'A4 單頁可直接單面或雙面列印，用長尾夾或打洞裝訂。';
  const sub = $('subtitle'); sub.placeholder = `每天動動腦　共 ${state.days} 天的練習`;
  drawPreview();
}
let tmr; const later = () => { clearTimeout(tmr); tmr = setTimeout(rebuild, 160); };

function syncSeg() {
  document.querySelectorAll('.seg[data-k]').forEach(seg => {
    const k = seg.dataset.k;
    seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(String(state[k]) === b.dataset.v)));
  });
}
document.querySelectorAll('.seg[data-k]').forEach(seg => {
  seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const k = seg.dataset.k, v = b.dataset.v;
    state[k] = ['days', 'perDay', 'fontScale'].includes(k) ? +v : v;
    syncSeg(); k === 'view' ? drawPreview() : later();
  });
});

const domBox = $('doms');
DOMAIN_ORDER.forEach(k => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'dom'; b.style.color = '#' + DOMAINS[k].color;
  b.innerHTML = `<span class="sw"></span><span><b>${DOMAINS[k].name}</b><small>${DOM_DESC[k]}</small></span>`;
  b.setAttribute('aria-pressed', 'true');
  b.addEventListener('click', () => {
    const on = state.domains.includes(k);
    if (on && state.domains.length === 1) { toast('至少要留一種能力'); return; }
    state.domains = on ? state.domains.filter(x => x !== k) : DOMAIN_ORDER.filter(x => x === k || state.domains.includes(x));
    b.setAttribute('aria-pressed', String(!on)); later();
  });
  domBox.appendChild(b);
});
const ck = $('checks');
PAGE_OPTS.forEach(([k, label]) => {
  const l = document.createElement('label');
  const i = document.createElement('input'); i.type = 'checkbox'; i.checked = true;
  i.addEventListener('change', () => { if (k === 'recall') state.recall = i.checked; else state.include[k] = i.checked ? 1 : 0; later(); });
  l.appendChild(i); l.appendChild(document.createTextNode(label)); ck.appendChild(l);
});
['title', 'subtitle', 'org'].forEach(id => $(id).addEventListener('input', later));
$('reroll').addEventListener('click', () => { state.seed = (state.seed * 1103515245 + 12345) >>> 0; rebuild(); toast('已換一組新題目'); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawPreview, 200); });

/* ===== 下載 ===== */
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2400); }
const loaded = {};
function loadScript(src) {
  if (!loaded[src]) loaded[src] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load')); document.head.appendChild(s); });
  return loaded[src];
}
async function saveFile(name, blob) {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({ filename: name, data: blob }); toast('已下載 ' + name); return; }
    }
  } catch (e) { if (e && e.code === 'declined') return; if (e && e.code && !['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(e.code)) { toast('下載沒有完成，請再試一次'); return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('已下載 ' + name);
}
function fname(ext, extra = '') { return `${(book.opt.title || '動腦手冊').replace(/[\\/:*?"<>|]/g, '')}_${book.opt.days}天_${book.opt.format}${extra}.${ext}`; }
async function busy(btn, fn) {
  const label = btn.querySelector('span'), old = label.textContent;
  btn.disabled = true; label.textContent = '製作中…';
  try { await fn(p => { label.textContent = p; }); }
  catch (e) { console.error(e); toast('製作失敗，請檢查網路後再試一次'); }
  finally { btn.disabled = false; label.textContent = old; }
}
$('dlPpt').addEventListener('click', e => busy(e.currentTarget, async () => {
  await loadScript('https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js');
  const blob = await exportPptx(book, window.PptxGenJS).write({ outputType: 'blob' });
  await saveFile(fname('pptx'), blob);
}));
$('dlDoc').addEventListener('click', e => busy(e.currentTarget, async () => {
  await loadScript('https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js');
  const blob = await window.docx.Packer.toBlob(exportDocx(book, window.docx));
  await saveFile(fname('docx'), blob);
}));
async function renderImages(setP) {
  await Promise.all([loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'), loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')]);
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const off = $('off'), imgs = [], n = book.pages.length;
  for (let i = 0; i < n; i++) {
    setP(`第 ${i + 1} / ${n} 頁`);
    off.innerHTML = ''; const pg = renderPage(book.layouts[i], book.G); off.appendChild(pg);
    const cv = await window.html2canvas(pg, { scale: 2, backgroundColor: '#ffffff', logging: false });
    imgs.push(cv.toDataURL('image/jpeg', 0.9));
  }
  off.innerHTML = '';
  return imgs;
}
$('dlPdf').addEventListener('click', e => busy(e.currentTarget, async setP => {
  const imgs = await renderImages(setP), G = book.G;
  const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: [G.W, G.H], orientation: 'portrait' });
  imgs.forEach((im, i) => { if (i) pdf.addPage([G.W, G.H], 'portrait'); pdf.addImage(im, 'JPEG', 0, 0, G.W, G.H); });
  await saveFile(fname('pdf'), pdf.output('blob'));
}));
$('dlBook').addEventListener('click', e => busy(e.currentTarget, async setP => {
  const imgs = await renderImages(setP), n = imgs.length;
  const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });
  imposition(n).forEach(([l, r], i) => {
    if (i) pdf.addPage('a4', 'landscape');
    pdf.addImage(imgs[l - 1], 'JPEG', 0, 0, 148.5, 210);
    pdf.addImage(imgs[r - 1], 'JPEG', 148.5, 0, 148.5, 210);
    pdf.setDrawColor(220); pdf.setLineDashPattern([1.5, 2], 0); pdf.line(148.5, 4, 148.5, 12); pdf.line(148.5, 198, 148.5, 206);
  });
  await saveFile(fname('pdf', '_摺頁小冊'), pdf.output('blob'));
}));

syncSeg();
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(rebuild);
rebuild();
